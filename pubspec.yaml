name: framelab
description: An offline-first Android photo, video and template studio.
publish_to: none
version: 1.0.0+2

environment:
  sdk: '>=3.11.5 <4.0.0'
  flutter: '>=3.41.9'

dependencies:
  ffmpeg_kit_flutter_new_full: 2.5.2
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  image: 4.10.1
  path: 1.9.1
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  video_player: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/licenses/
  fonts:
    - family: StudioSans
      fonts:
        - asset: assets/fonts/StudioSans.ttf
    - family: StudioSerif
      fonts:
        - asset: assets/fonts/StudioSerif.ttf
    - family: StudioMono
      fonts:
        - asset: assets/fonts/StudioMono.ttf
    - family: StudioScript
      fonts:
        - asset: assets/fonts/StudioScript.ttf
    - family: StudioDisplay
      fonts:
        - asset: assets/fonts/StudioDisplay.ttf
